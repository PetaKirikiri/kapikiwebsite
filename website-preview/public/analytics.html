<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Visitors · Ka Piki</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ed;color:#214a3e;font:15px/1.5 system-ui,sans-serif}header{background:#214a3e;color:#eff3df;padding:24px max(24px,calc((100vw - 1120px)/2))}header a{color:inherit;text-decoration:none;font-weight:750}h1{font:36px Georgia;margin:12px 0}main{max-width:1168px;margin:auto;padding:28px 24px}button,input,select{font:inherit;padding:10px 14px;border:1px solid #c7d3c9;border-radius:6px;background:#fff;color:inherit}button{cursor:pointer}button:hover{background:#e6eee2}button:focus-visible,a:focus-visible{outline:3px solid #659985;outline-offset:3px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}.stats div,section{background:#fff;border:1px solid #d7dfd5;border-radius:10px;padding:20px}.stats strong{display:block;font-size:30px}.stats span{color:#62746b}section{margin-bottom:24px}h2{margin:0 0 16px;font-size:20px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:12px;color:#62746b}th,td{padding:12px 8px;border-bottom:1px solid #e0e5dc}td:first-child{padding-left:0}.visitor{border:0;background:none;padding:0;text-align:left;text-decoration:underline;text-underline-offset:4px}.muted{color:#62746b}#status{min-height:24px;margin-bottom:12px}#status.error{color:#913a37}[hidden]{display:none!important}#login{max-width:520px}#login input{width:100%;margin:12px 0}#journey{border-left:4px solid #659985}@media(max-width:500px){main{padding:20px 12px}.stats{gap:8px}.stats div{padding:12px}.stats strong{font-size:24px}}

.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
header{display:flex;align-items:center;gap:24px;padding-top:20px;padding-bottom:20px}header a{font-size:20px;letter-spacing:-.6px}h1{font-size:28px;margin:0;padding-left:24px;border-left:1px solid #ffffff30}.controls{gap:8px;margin-bottom:20px}.controls #refresh{margin-left:auto}.icon-button{display:inline-grid;place-items:center;width:42px;height:42px;padding:0;background:transparent}.stats{gap:12px}.stats div{position:relative;padding:18px 20px}.stats div>.icon{position:absolute;right:18px;top:20px;color:#668477}.stats strong{font-size:32px;font-weight:600;letter-spacing:-1px}.stats span{font-size:13px}h2{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600}h2 .icon{color:#668477;width:18px;height:18px}section{padding:20px;border-radius:8px}.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-heading h2{margin:0}.visitor{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:500;min-height:28px}.visitor .icon{width:15px;height:15px;color:#729184}.visitor:hover{text-decoration:underline;background:transparent}th{font-weight:500}td{font-size:14px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#f7f9f4}#status:empty{display:none}#status{font-size:13px;color:#62746b;margin-top:8px}#journey{border-left-width:3px}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #659985;outline-offset:3px}
@media(max-width:500px){header{padding:18px 16px;gap:16px}h1{font-size:24px;padding-left:16px}.stats div{padding:14px 12px}.stats div>.icon{position:static;width:18px;height:18px;margin-bottom:8px}.stats strong{font-size:26px}.controls select{padding:10px 8px;font-size:13px}section{padding:16px}.controls{gap:6px}}
</style></head><body><svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs><symbol id="icon-people" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 3a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.87M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0"/></symbol><symbol id="icon-clock" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0M12 7v5l3 2"/></symbol><symbol id="icon-pages" viewBox="0 0 24 24"><path d="M8 3h8l4 4v14H8ZM16 3v5h4M4 7v14"/></symbol><symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 6M4 12l2 6a7 7 0 0 0 12-1"/></symbol><symbol id="icon-lock" viewBox="0 0 24 24"><path d="M6 10h12v11H6ZM8 10V6a4 4 0 0 1 8 0v4M12 14v3"/></symbol><symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol><symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol></defs></svg><header><a href="/">KA PIKI</a><h1>Visitors</h1></header><main>
<form id="login" hidden><h2>Analytics access</h2><label>Access key<input type="password" id="key" autocomplete="current-password" required></label><button>Open visitor log</button></form>
<div id="dashboard"><div class="controls"><label><span class="sr-only">Period</span><select id="days"><option value="1">Last 24 hours</option><option value="7" selected>Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option></select></label><button id="refresh" class="icon-button" aria-label="Refresh" title="Refresh"><svg class="icon" aria-hidden="true"><use href="#icon-refresh"/></svg></button><button id="lock" class="icon-button" aria-label="Lock analytics" title="Lock analytics"><svg class="icon" aria-hidden="true"><use href="#icon-lock"/></svg></button></div>
<div class="stats"><div><svg class="icon" aria-hidden="true"><use href="#icon-people"/></svg><strong id="visitors">—</strong><span>Visitors</span></div><div><svg class="icon" aria-hidden="true"><use href="#icon-clock"/></svg><strong id="sessions">—</strong><span>Visits</span></div><div><svg class="icon" aria-hidden="true"><use href="#icon-pages"/></svg><strong id="views">—</strong><span>Page views</span></div></div>

<section id="journey" hidden><div class="section-heading"><h2 id="journey-title"></h2><button id="close" class="icon-button" aria-label="Close history" title="Close history"><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button></div><div class="scroll"><table><thead><tr><th>When</th><th>Page</th><th>Device</th><th>Country</th><th>Source</th></tr></thead><tbody id="events"></tbody></table></div></section>
<section><h2><svg class="icon" aria-hidden="true"><use href="#icon-people"/></svg> Recent visitors</h2><div class="scroll"><table><thead><tr><th>Visitor</th><th title="Country of the latest visit">Country</th><th title="First seen in the selected period">First visit</th><th>Last visit</th><th>Visits</th><th>Pages</th></tr></thead><tbody id="people"></tbody></table></div></section>
<section><h2><svg class="icon" aria-hidden="true"><use href="#icon-pages"/></svg> Pages</h2><div class="scroll"><table><thead><tr><th>Page</th><th>Views</th></tr></thead><tbody id="pages"></tbody></table></div></section></div><p id="status" role="status"></p>
</main><script type="module">
const $=id=>document.getElementById(id);let key='',generation=0;

const regions=new Intl.DisplayNames(['en'],{type:'region'});
const country=value=>value ? regions.of(value) || value : 'Unknown';
const date=value=>new Date(value).toLocaleString();
function cell(row,value){const td=document.createElement('td');td.textContent=String(value??'—');row.append(td);return td}
function row(id,values){const tr=document.createElement('tr');values.forEach(value=>cell(tr,value));$(id).append(tr);return tr}
function status(message,error=false){$('status').textContent=message;$('status').className=error?'error':''}
async function request(visitor){
 const q=new URLSearchParams({days:$('days').value,environment:'live'});if(visitor)q.set('visitor',visitor);
 for(let attempt=0;attempt<2;attempt++){
  try{
   const response=await fetch('/__analytics?'+q,{headers:{'x-analytics-key':key},signal:AbortSignal.timeout(20000)});
   const body=await response.json();
   if(response.status===401){$('dashboard').hidden=true;$('login').hidden=false;throw Error(body.error||'Enter your access key.')}
   if(!response.ok){if(attempt===0&&response.status>=500)continue;throw Error(body.error||'Unable to load visits.')}
   return body;
  }catch(error){if(attempt===0&&(error instanceof TypeError||error.name==='TimeoutError'))continue;throw Error(error instanceof TypeError||error.name==='TimeoutError'?"Connection lost. Use refresh to retry.":error.message)}
 }
}

async function history(person){const current=generation;status('Loading history…');try{const data=await request(person.visitor_id);if(current!==generation)return;$('journey-title').textContent=person.email||'Visitor '+person.visitor_id.slice(0,8);$('events').replaceChildren();data.events.forEach(e=>row('events',[date(e.visited_at),e.path,e.device,country(e.country),e.referrer||'Direct / unknown']));$('journey').hidden=false;$('journey').scrollIntoView({behavior:'smooth',block:'start'});status('')}catch(error){status(error.message,true)}}
async function load(){const current=++generation;$('journey').hidden=true;status('Loading visits…');try{const data=await request();if(current!==generation)return;$('login').hidden=true;$('dashboard').hidden=false;for(const k of ['visitors','sessions','views'])$(k).textContent=data.summary[k];$('people').replaceChildren();data.visitors.forEach(p=>{const tr=row('people',['',country(p.country),date(p.first_seen),date(p.last_seen),p.sessions,p.views]);const button=document.createElement('button');button.className='visitor';button.textContent=p.email||'Visitor '+p.visitor_id.slice(0,8);button.insertAdjacentHTML('beforeend','<svg class="icon" aria-hidden="true"><use href="#icon-arrow"/></svg>');button.onclick=()=>history(p);tr.firstChild.append(button)});$('pages').replaceChildren();data.pages.forEach(p=>row('pages',[p.path,p.views]));status(data.visitors.length?'':'No visits yet.')}catch(error){status(error.message,true)}}
$('login').onsubmit=e=>{e.preventDefault();key=$('key').value;$('key').value='';load()};$('refresh').onclick=load;$('days').onchange=load;$('close').onclick=()=>{$('journey').hidden=true};$('lock').onclick=()=>{++generation;key='';$('people').replaceChildren();$('events').replaceChildren();$('dashboard').hidden=true;$('login').hidden=false;status('Locked')};window.addEventListener('online',load);load();
</script></body></html>
